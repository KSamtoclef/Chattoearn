name: Advance Member Journey

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/advance-member-journey.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          js_path = Path('assets/js/chatearn-app.js')
          index = index_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          index = once(
              index,
              '<title>ChatEarn — Chat With Foreigners & Earn in Naira</title>',
              '<title>DEMO - ChatEarn — Chat With Foreigners & Earn in Naira</title>',
              'title'
          )
          index = index.replace('<!-- WHATSAPP SHARE RULES POPUP — DEMO -->', '<!-- WHATSAPP SHARE RULES POPUP -->')
          index = index.replace('Demo note: the website can record that WhatsApp was opened, but it cannot independently confirm that a message was sent.', 'Technical note: the website can record that WhatsApp was opened, but it cannot independently confirm that a message was sent.')
          index = index.replace('/* WHATSAPP SHARE RULES POPUP OVERRIDE — DEMO */', '/* WHATSAPP SHARE RULES POPUP OVERRIDE */')
          index = index.replace('./assets/js/chatearn-app.js?v=20260722-long-chat-opportunities2', './assets/js/chatearn-app.js?v=20260729-advanced-journey1')

          js = once(js, 'const FIRST_WITHDRAWAL_MINIMUM=30000;', 'const FIRST_WITHDRAWAL_MINIMUM=25000;', 'withdrawal minimum')

          old_setup = """function runSetup(isNew){
  showScreen('loading');
  if($('ldTitle'))$('ldTitle').textContent=isNew?'Setting Up Your Account':'Welcome Back';
  if($('ldSub'))$('ldSub').textContent='Matching you with an available guided chat…';
  let progress=0;clearInterval(runSetup.timer);
  runSetup.timer=setInterval(()=>{progress+=20;if($('ldFill'))$('ldFill').style.width=`${progress}%`;if(progress>=100){clearInterval(runSetup.timer);openChat(Math.floor(Math.random()*PARTNERS.length),true)}},250);
}"""
          new_setup = """function runSetup(isNew){
  showScreen('loading');
  if($('ldTitle'))$('ldTitle').textContent=isNew?'Setting Up Your Account':'Welcome Back';
  if($('ldSub'))$('ldSub').textContent='Matching you with an available guided chat…';
  let progress=0;clearInterval(runSetup.timer);
  runSetup.timer=setInterval(()=>{progress+=20;if($('ldFill'))$('ldFill').style.width=`${progress}%`;if(progress>=100){clearInterval(runSetup.timer);showScreen('dashboard');setTimeout(()=>openChat(Math.floor(Math.random()*PARTNERS.length),true),900)}},250);
}"""
          js = once(js, old_setup, new_setup, 'automatic first chat')

          old_gate = """  if(!state.withdrawal&&state.availableBalance>=FIRST_WITHDRAWAL_MAXIMUM){
   toast('You have reached your first earning limit. Complete your withdrawal setup to continue earning.',true);
   withdrawalUnlockCard();busy=false;input.disabled=false;return;
  }"""
          new_gate = """  if(!state.withdrawal&&state.availableBalance>=FIRST_WITHDRAWAL_MINIMUM){
   toast('Your first withdrawal is ready. Place the minimum withdrawal, complete sharing, and open KYC verification before continuing.',true);
   showFirstWithdrawalGate();withdrawalUnlockCard();busy=false;input.disabled=false;return;
  }
  if(state.withdrawal&&state.paymentStatus!=='pending_review'){
   toast('Complete the sharing and KYC steps before continuing your chat.',true);
   state.sharing.count<REQUIRED_SHARE_ACTIONS?showScreen('sharewall'):showScreen('kyc');return;
  }"""
          js = once(js, old_gate, new_gate, 'first withdrawal chat gate')

          old_unlock = "if(state.availableBalance>=FIRST_WITHDRAWAL_MINIMUM&&!state.unlockShown){state.unlockShown=true;saveState();toast('Withdrawal unlocked 🎉 You can withdraw now or keep chatting.')}"
          new_unlock = "if(state.availableBalance>=FIRST_WITHDRAWAL_MINIMUM&&!state.unlockShown){state.unlockShown=true;saveState();toast('First withdrawal unlocked 🎉 Complete withdrawal, sharing, and KYC to continue.');showFirstWithdrawalGate()}"
          js = once(js, old_unlock, new_unlock, 'unlock trigger')

          old_card = "card.innerHTML=`<div style=\"font-size:30px;margin-bottom:8px\">🎉</div><b style=\"display:block;color:#00E676;font-size:21px\">${money(state.availableBalance)} Earned!</b><p style=\"color:#b8c2bc;font-size:13px;margin:7px 0 14px\">Withdrawal available! Withdraw now.</p><button onclick=\"goScreen('earnings')\" style=\"padding:13px 28px;border:0;border-radius:12px;background:#00C853;color:#001b0b;font-size:15px;font-weight:900\">Withdraw Now →</button>`;"
          new_card = "card.innerHTML=`<div style=\"font-size:34px;margin-bottom:8px\">🎉</div><b style=\"display:block;color:#00E676;font-size:21px\">First Withdrawal Unlocked</b><p style=\"color:#b8c2bc;font-size:13px;margin:7px 0 14px;line-height:1.55\">You reached ${money(FIRST_WITHDRAWAL_MINIMUM)}. Place your first withdrawal, complete the sharing stage, and open KYC verification before new earnings unlock.</p><button onclick=\"goScreen('withdraw')\" style=\"width:100%;padding:15px 20px;border:0;border-radius:12px;background:#00C853;color:#001b0b;font-size:16px;font-weight:950\">PLACE MINIMUM WITHDRAWAL NOW →</button>`;"
          js = once(js, old_card, new_card, 'unlock card')

          gate_anchor = "window.tryWithdraw=()=>state.availableBalance<FIRST_WITHDRAWAL_MINIMUM?toast(`${money(FIRST_WITHDRAWAL_MINIMUM-state.availableBalance)} remaining before withdrawal.`,true):showScreen('earnings');"
          gate_add = """window.tryWithdraw=()=>state.availableBalance<FIRST_WITHDRAWAL_MINIMUM?toast(`${money(FIRST_WITHDRAWAL_MINIMUM-state.availableBalance)} remaining before withdrawal.`,true):showScreen('earnings');
function showFirstWithdrawalGate(){
  let modal=$('firstWithdrawalGate');if(modal)modal.remove();
  modal=document.createElement('div');modal.id='firstWithdrawalGate';modal.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:20px';
  modal.innerHTML=`<div style="width:min(100%,390px);background:#171b18;border:2px solid #00E676;border-radius:20px;padding:22px;text-align:center"><div style="font-size:44px">🎉</div><h2 style="margin:8px 0;color:#00E676">Your First Withdrawal Is Ready</h2><p style="color:#b8c2bc;font-size:14px;line-height:1.65;text-align:left">You have reached <b style="color:#fff">${money(FIRST_WITHDRAWAL_MINIMUM)}</b>. To unlock more earnings, place your first withdrawal, complete the required sharing stage, and open KYC verification. Your request will remain pending until it is reviewed.</p><button onclick="document.getElementById('firstWithdrawalGate').remove();goScreen('withdraw')" style="width:100%;padding:15px;border:0;border-radius:12px;background:#00C853;color:#001b0b;font-size:16px;font-weight:950;margin-top:12px">PLACE MINIMUM WITHDRAWAL NOW →</button><button onclick="document.getElementById('firstWithdrawalGate').remove();goScreen('earnings')" style="width:100%;padding:12px;border:1px solid #39413b;border-radius:10px;background:#1d221e;color:#fff;font-weight:900;margin-top:8px">VIEW BALANCE</button></div>`;
  document.body.appendChild(modal);
}"""
          js = once(js, gate_anchor, gate_add, 'withdrawal modal')

          old_place = """  toast('Withdrawal request created. Continue with the sharing stage.');
  showScreen('sharewall');"""
          new_place = """  toast('Withdrawal request created. Complete the required sharing and KYC steps to continue.');
  showScreen('sharewall');
  setTimeout(()=>$('shareRulesModal')?.classList.add('show'),150);"""
          js = once(js, old_place, new_place, 'share popup after form')

          dashboard_anchor = """  mountPartnerAd();
}
function renderEarnings(){"""
          dashboard_upgrade = """  mountPartnerAd();
  mountMemberHub();
}
function mountMemberHub(){
  const host=document.querySelector('#dashboard .bonus-banner');if(!host)return;
  let hub=$('memberHub');if(!hub){hub=document.createElement('div');hub.id='memberHub';host.after(hub)}
  const status=!state.withdrawal?'Not started':state.paymentStatus==='pending_review'?'Under review':'Requirements in progress';
  hub.style.cssText='margin:0 16px 16px;padding:16px;border-radius:16px;background:#171b18;border:1px solid #303832';
  hub.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:12px"><div><div style="font-size:10px;color:#88948d;letter-spacing:1px">MEMBER HOME</div><b style="font-size:18px">${esc(state.name)}</b></div><div style="text-align:right"><div style="font-size:10px;color:#88948d">WITHDRAWAL</div><b style="color:#00E676">${status}</b></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="continueLastChat()" style="padding:12px;border:0;border-radius:10px;background:#00C853;font-weight:900">CONTINUE CHAT</button><button onclick="goScreen('earnings')" style="padding:12px;border:1px solid #39413b;border-radius:10px;background:#1d221e;color:#fff;font-weight:900">EARNINGS</button><button onclick="openWithdrawalHub()" style="padding:12px;border:1px solid #39413b;border-radius:10px;background:#1d221e;color:#fff;font-weight:900">WITHDRAWAL / STATUS</button><button onclick="openProfileHub()" style="padding:12px;border:1px solid #39413b;border-radius:10px;background:#1d221e;color:#fff;font-weight:900">PROFILE</button></div>`;
}
window.openWithdrawalHub=()=>{if(state.withdrawal)return showScreen(state.paymentStatus==='pending_review'?'processing':state.sharing.count<REQUIRED_SHARE_ACTIONS?'sharewall':'kyc');showScreen(state.availableBalance>=FIRST_WITHDRAWAL_MINIMUM?'withdraw':'earnings')};
window.openProfileHub=()=>{
  let modal=$('profileHubModal');if(modal)modal.remove();modal=document.createElement('div');modal.id='profileHubModal';modal.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:20px';
  modal.innerHTML=`<div style="width:min(100%,380px);background:#171b18;border:1px solid #303832;border-radius:18px;padding:20px"><h3 style="margin:0 0 12px">Profile</h3><div style="color:#b8c2bc;font-size:13px;line-height:1.8"><b style="color:#fff">Name:</b> ${esc(state.name)}<br><b style="color:#fff">Balance:</b> ${money(state.availableBalance)}<br><b style="color:#fff">Activity Points:</b> ${Number(state.activityPoints||0)}<br><b style="color:#fff">Withdrawal:</b> ${!state.withdrawal?'Not started':esc(state.paymentStatus.replaceAll('_',' '))}</div><button onclick="document.getElementById('profileHubModal').remove()" style="width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#00C853;font-weight:900">CLOSE</button></div>`;document.body.appendChild(modal);
};
function renderEarnings(){"""
          js = once(js, dashboard_anchor, dashboard_upgrade, 'member dashboard hub')

          old_return = "window.returnToChat=()=>{state.adsUnlocked=true;state.ad.replyCounter=0;state.ad.nextInterval=randomInterval();saveState();continueLastChat();toast('Your withdrawal request is awaiting review. Continue chatting and earning while you wait.')} ;"
          new_return = "window.returnToChat=()=>{state.adsUnlocked=true;state.ad.replyCounter=0;state.ad.nextInterval=randomInterval();saveState();showScreen('dashboard');toast('Your withdrawal request is awaiting review. Use your member home to continue chatting or view the status.')} ;"
          js = once(js, old_return, new_return, 'processing return destination')

          old_action = "actions.innerHTML='<div style=\"text-align:center;font-size:17px;font-weight:950;color:#69F0AE\">Continue chatting and keep earning</div><button onclick=\"returnToChat()\" style=\"width:100%;min-height:64px;padding:18px 14px;border:0;border-radius:15px;background:#00C853;color:#001b0b;font-size:18px;font-weight:950;line-height:1.25;box-shadow:0 10px 28px rgba(0,200,83,.35)\">RETURN TO CHAT & CONTINUE EARNING</button>';"
          new_action = "actions.innerHTML='<div style=\"text-align:center;font-size:17px;font-weight:950;color:#69F0AE\">Your request is saved</div><button onclick=\"returnToChat()\" style=\"width:100%;min-height:64px;padding:18px 14px;border:0;border-radius:15px;background:#00C853;color:#001b0b;font-size:18px;font-weight:950;line-height:1.25;box-shadow:0 10px 28px rgba(0,200,83,.35)\">RETURN TO MEMBER HOME</button>';"
          js = once(js, old_action, new_action, 'processing action')

          index_path.write_text(index, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')
          Path('.github/workflows/advance-member-journey.yml').unlink()
          PY

      - name: Validate JavaScript
        run: node --check assets/js/chatearn-app.js

      - name: Commit upgraded journey
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Advance onboarding withdrawal and return journey"
          git push