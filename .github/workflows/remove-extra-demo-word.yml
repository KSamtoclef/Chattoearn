name: Remove extra Demo word

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-extra-demo-word.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Demo only in title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          expected = '/* WHATSAPP SHARE RULES POPUP — DEMO */'
          if expected not in text:
              raise SystemExit('Expected comment not found; no files changed.')
          text = text.replace(expected, '/* WHATSAPP SHARE RULES POPUP */', 1)
          if text.count('DEMO') != 1 or '<title>DEMO - ChatEarn — Chat With Foreigners & Earn in Naira</title>' not in text:
              raise SystemExit('Validation failed: DEMO must remain only in the title.')
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/remove-extra-demo-word.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-extra-demo-word.yml
          git commit -m "Keep Demo label only in page title"
          git push
