name: Remove counter and add direct links

on:
  push:
    paths:
      - '.github/workflows/remove-counter-add-direct-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(
              r'\n?<!-- Visitor counter -->\s*<div id=["\']visitor-counter["\']>.*?</div>\s*',
              '\n',
              index,
              flags=re.S,
          )
          index_path.write_text(index, encoding='utf-8')

          app_path = Path('assets/js/chatearn-app.js')
          app = app_path.read_text(encoding='utf-8')

          first_url = 'https://oatstuckalfred.com/trxz4e2k9?key=e5fca8368b788c42dc7608d035de37f0'
          second_url = 'https://oatstuckalfred.com/zkfsiqgma3?key=7fcbfd99661ec943edc23caf2592add8'

          if first_url not in app:
              pattern = r"(\{id:'inline_chat_2'.*?maximumShowsPerSession:4\})"
              replacement = r"\1,\n  {id:'inline_chat_3',label:'Featured Opportunity',title:'Another Activity Is Available',description:'Open this optional activity and return to continue your chat.',buttonText:'OPEN FEATURED ACTIVITY →',url:'" + first_url + "',active:true,theme:'blue',icon:'🌟',minimumMessages:3,maximumShowsPerSession:4}"
              app, count = re.subn(pattern, replacement, app, count=1)
              if count != 1:
                  raise SystemExit('inline chat insertion point not found')

          if second_url not in app:
              pattern = r"(\{id:'inpage_2'.*?icon:'🎁'\})"
              replacement = r"\1,\n   {id:'inpage_3',label:'Extra Discovery',title:'A New Optional Activity Is Ready',description:'Check the current activity, then return to continue using ChatEarn.',buttonText:'VIEW EXTRA ACTIVITY →',url:'" + second_url + "',active:true,theme:'emerald',icon:'🎯'}"
              app, count = re.subn(pattern, replacement, app, count=1)
              if count != 1:
                  raise SystemExit('in-page insertion point not found')

          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Remove one-time workflow files
        run: |
          rm -f .github/workflows/remove-counter-add-direct-links.yml
          rm -f .github/workflows/install-visitor-counter.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/chatearn-app.js .github/workflows
          git diff --cached --quiet || git commit -m "Remove visitor counter and add two direct link placements"
          git push
