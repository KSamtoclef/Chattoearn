name: Install pre-KYC update module
on:
  push:
    paths:
      - '.github/workflows/install-pre-kyc-update.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add module to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./assets/js/pre-kyc-update.js?v=20260730-1"></script>'
          if tag not in s:
              anchor='<script src="./assets/js/member-journey-override.js?v=20260729-1"></script>'
              if anchor not in s:
                  raise SystemExit('Expected script anchor not found')
              s=s.replace(anchor,anchor+'\n'+tag,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/js/chatearn-app.js
          node --check assets/js/pre-kyc-update.js
          grep -Fq 'pre-kyc-update.js?v=20260730-1' index.html
      - name: Commit installation
        run: |
          rm -f .github/workflows/install-pre-kyc-update.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html assets/js/pre-kyc-update.js .github/workflows/install-pre-kyc-update.yml
          git commit -m "Install one-time pre-KYC update gate" || exit 0
          git push
