name: Apply ChatEarn Chat Flow Refinement

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_chat_flow_refinement.py
      - .github/workflows/apply-chat-flow-refinement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused flow refinement
        run: python scripts/apply_chat_flow_refinement.py

      - name: Validate JavaScript syntax
        run: node --check assets/js/chatearn-app.js

      - name: Validate login and registration wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('assets/js/chatearn-app.js').read_text(encoding='utf-8')
          checks={
            'phone field removed':'id="regPhone"' not in html,
            'login link clickable':'onclick="openLogin()"' in html,
            'login modal exists':'id="loginModal"' in html,
            'register handler exists':'window.doRegister=async' in js,
            'login handler exists':'window.doLogin=async' in js,
            'new auth storage isolated':"storageKey:'ce-auth-chattoearn-v1'" in js,
            'four-reply first stage':'state.withdrawal?currentPartner.rate:5000' in js,
            'automatic KYC navigation':"showScreen('kyc')" in js,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('Failed checks: '+', '.join(failed))
          print('All focused checks passed')
          PY

      - name: Commit refined production files
        run: |
          git config user.name "ChatEarn Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/js/chatearn-app.js
          if git diff --cached --quiet; then
            echo "No refinement changes"
          else
            git commit -m "Refine ChatEarn sharing and human chat flow"
            git push
          fi
